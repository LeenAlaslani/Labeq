name: LABEQ checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest playwright "gradio>=6,<7"
      - run: python -m pytest -q
      - run: node tests/test_v16_coach.js
      - run: node tests/test_space_client.js
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8080 --bind 127.0.0.1 --directory docs &
          python -m uvicorn app:app --host 127.0.0.1 --port 8006 &
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8006/api/capabilities > /dev/null && break
            sleep 1
          done
          python tests/browser_smoke.py --demo http://127.0.0.1:8080/preview.html --mock-web http://127.0.0.1:8006
